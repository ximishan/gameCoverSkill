display_name: 游戏封面生成器
short_description: 保留原游戏辨识度，自动识别类型，并让场景与文字版式都产生差异化
default_prompt: 根据我提供的游戏名称、文案和图片生成高点击中文游戏封面。对于已有的真实游戏，优先保留原游戏的角色比例、脸部简化方式、线条/上色、服装、场景和道具语言，再叠加对应游戏类型的高点击封面模板；不要为了“好看”把原游戏改成泛用动漫、通用Q版、写实或3D风格。用户提供截图时优先以截图为身份参考；没有截图且工具允许时，优先参考官方/商店/可靠实机图，而不是凭空创造一套新角色。主标题位置是硬规则：除非用户明确要求其他高度，主标题的布局顶部锚点必须严格固定在画布高度35%的位置，即 y = 0.35 × canvas height；对于1080×1920的9:16画布，标题锚点约为Y=672，与剪映中Y≈670基本一致。字体本身的描边、阴影或字形边界可以在该锚点附近产生少量像素视觉外延，但不得改变标题布局坐标。批量生成时只能变化标题的颜色、描边、阴影、字号、横向位置或对齐方式，不允许改变主标题的纵向锚点。9:16顶部标签可放在约9%–11%，标签与35%标题之间的画面空间应保留给游戏画面，不要为了填空移动标题。所有默认封面还必须固定加入一条底部引导：文字必须逐字保持为“佑滑自取”，不要自动纠正成“右滑自取”；该引导整体视觉中心固定在画布高度约75%的位置，即 y≈0.75×canvas height，文字使用参考图类似的超粗白字+厚黑描边/阴影，右侧紧跟一个醒目的红色向右箭头，箭头也带黑色外轮廓。这个“佑滑自取 + 右箭头”属于固定系统元素，不属于用户accent，也不能因为用户没提供accent而省略。为了真正保证35%标题坐标和75%引导坐标，默认不要让生图模型直接绘制主标题或固定引导：先生成无标题、无宣传文字的游戏背景，再使用 scripts/render_cover.py 统一叠加准确文字和箭头；只有用户明确要求直接把文字画进生成图时才允许走纯生图路径，并且这时不能宣称像素级精确。一次生成2张及以上时自动开启双重差异化：第一层改变人物组合、场景、镜头、活动和构图；第二层改变文字视觉系统，包括标题颜色/填充、描边或阴影、顶部标签形状与位置、卖点卡片形状与排列、版本/菜单标签位置、颜色角色分配以及accent处理。固定“佑滑自取 + 右箭头”的文字内容、纵向位置和基本样式不要作为批量差异化项目。不要把同一个红色顶部标签、同一个标题样式、同一个黄色卖点条、同一个绿色角标和同一个底部大横幅机械复制到每张图上。文字内容必须保持用户原文，不可为了差异化修改文案；例如“无广版”不能擅自改成“无广告版”，“自带菜单”不能改成“内置菜单”。如果用户没有提供accent，不要为了填满版面自动生成额外底部CTA或重复标题卖点；但固定“佑滑自取 + 右箭头”仍然必须保留。米加小镇、托卡类、阿凡达世界等生活模拟游戏按 simulation + cozy-life-sim 处理，保持2D娃娃屋/生活场景辨识度，同时在粉、蓝、薄荷绿、暖黄、奶油色等原作兼容色系中变化文字配色与贴纸/气泡/圆角卡片布局。区分游戏类型和宣传标签，支持DLC、汉化、存档、版本号、PC/安卓信息和多种尺寸，不要虚构用户未提供的功能。
