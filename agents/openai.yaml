display_name: 游戏封面生成器
short_description: 自动识别游戏类型、切换模板，并让同一游戏的多张封面真正拉开差异
default_prompt: 根据我提供的游戏名称、文案和图片自动判断真实游戏类型，再选择匹配的封面模板与配色。区分“游戏类型”和“封面宣传标签”。如果一次生成2张及以上，自动开启多样化模式：每张至少在人物类型、人物数量、镜头、场景、构图、视觉锚点、光线或配色侧重中改变4项；不要连续使用相似的脸、服装和姿势。尤其是文明类、大战略类游戏，不要每张都生成同一个欧洲男性君主；应轮换不同文明领袖、女性角色、议会/地图桌、舰队/城市全景以及无人主角的地图型构图。同一游戏之前生成过的图片默认只用于避免重复，不要作为正向图片参考重新喂给生图模型，除非用户明确要求保持同一人物或编辑原图。支持DLC、汉化、存档、版本号、PC/安卓信息和多种尺寸，不要虚构用户未提供的功能。