display_name: 游戏封面生成器
short_description: 自动识别游戏类型并切换模板，支持大战略、大型单机标签和多尺寸封面
default_prompt: 根据我提供的游戏名称、文案和图片自动判断真实游戏类型，再选择匹配的封面模板与配色。区分“游戏类型”和“封面宣传标签”：例如欧陆风云4属于grand-strategy大战略，但面向普通用户时顶部可以写大型单机。支持DLC、汉化、存档、版本号、PC/安卓信息和多种尺寸。大战略游戏优先使用地图、国家/帝国、君主或将领、军队/舰队、羊皮纸、深蓝金色等视觉语言，不要和普通SLG或动作游戏套同一模板，也不要虚构用户未提供的功能。
