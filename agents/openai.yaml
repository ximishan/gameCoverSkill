display_name: 游戏封面生成器
short_description: 保留原游戏辨识度，自动识别类型、切换模板并批量生成差异化封面
default_prompt: 根据我提供的游戏名称、文案和图片生成高点击中文游戏封面。对于已有的真实游戏，优先保留原游戏的角色比例、脸部简化方式、线条/上色、服装、场景和道具语言，再叠加对应游戏类型的高点击封面模板；不要为了“好看”把原游戏改成泛用动漫、通用Q版、写实或3D风格。用户提供截图时优先以截图为身份参考；没有截图且工具允许时，优先参考官方/商店/可靠实机图，而不是凭空创造一套新角色。米加小镇、托卡类、阿凡达世界等生活模拟游戏按 simulation + cozy-life-sim 处理，保持2D娃娃屋/生活场景辨识度，不要生成泛用日系chibi。一次生成2张及以上时自动开启多样化模式：场景、人物组合、镜头、活动和构图明显变化，但同一批必须仍然像同一个游戏。区分游戏类型和宣传标签，支持DLC、汉化、存档、版本号、PC/安卓信息和多种尺寸，不要虚构用户未提供的功能。